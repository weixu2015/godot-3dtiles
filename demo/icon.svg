<?xml version="1.0" encoding="UTF-8"?>
<!--
  Project mark for godot-3dtiles, replacing Godot's default icon. Drawn from
  scratch for this project - no third-party logo is used anywhere in the demo.

  The idea: a globe drawn as a graticule (the ellipsoid) with one quadtree split
  visible, because what this extension actually does is split the planet into a
  quadtree and stream tiles onto it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="globeGlass" cx="38%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#1d3f63"/>
      <stop offset="62%" stop-color="#0f2440"/>
      <stop offset="100%" stop-color="#081527"/>
    </radialGradient>
    <linearGradient id="rimEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5fd0ff"/>
      <stop offset="100%" stop-color="#2b7fd4"/>
    </linearGradient>
  </defs>

  <!-- disc -->
  <circle cx="64" cy="64" r="57" fill="url(#globeGlass)"/>

  <!-- meridians -->
  <g fill="none" stroke="#4aa3d8" stroke-opacity="0.55" stroke-width="2">
    <ellipse cx="64" cy="64" rx="22" ry="57"/>
    <ellipse cx="64" cy="64" rx="42" ry="57"/>
  </g>
  <!-- parallels -->
  <g fill="none" stroke="#4aa3d8" stroke-opacity="0.55" stroke-width="2">
    <path d="M7 64 H121"/>
    <path d="M13 45 H115"/>
    <path d="M13 83 H115"/>
  </g>

  <!-- one quadtree split across the face, with the SE quadrant splitting again -->
  <g fill="none" stroke="url(#rimEdge)" stroke-width="2.6" stroke-linecap="round">
    <path d="M64 22 V106"/>
    <path d="M22 64 H106"/>
    <path d="M64 71 H106"/>
    <path d="M85 64 V106"/>
  </g>

  <!-- the first-level tiles, lit from the upper left -->
  <rect x="23" y="23" width="38" height="38" rx="2" fill="#7fe3ff" fill-opacity="0.13"/>
  <rect x="66" y="23" width="38" height="38" rx="2" fill="#7fe3ff" fill-opacity="0.08"/>
  <rect x="23" y="66" width="38" height="38" rx="2" fill="#7fe3ff" fill-opacity="0.08"/>

  <!-- rim -->
  <circle cx="64" cy="64" r="57" fill="none" stroke="url(#rimEdge)" stroke-width="4"/>
  <circle cx="64" cy="64" r="61" fill="none" stroke="#0a1826" stroke-opacity="0.85" stroke-width="4"/>
</svg>
